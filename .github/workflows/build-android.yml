name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "buildozer.spec"
      - "p4a-recipes/**"
      - "assets/**"
      - "color/**"
      - "scripts/build-android-ci.sh"
      - ".github/workflows/build-android.yml"

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libltdl-dev \
            gettext autopoint patch ccache openjdk-17-jdk

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer setuptools "cython==0.29.36"

      - name: Cache buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'p4a-recipes/**') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'debug' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/build-android-ci.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GudoSnake-android-${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'debug' }}
          path: bin/*.apk
          if-no-files-found: error
